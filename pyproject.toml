[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "selexprep"
version = "0.4.0"
description = "Accession-first preprocessing for public HT-SELEX with primer auto-inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{name = "Marco Rotanegroni", email = "marco.rotanegroni@studenti.unipd.it"}]
keywords = ["SELEX", "aptamer", "HT-SELEX", "bioinformatics", "primer", "FASTQ"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "typer >= 0.12",
  "numpy >= 1.24",
  "pandas >= 2.0",
  "pyarrow >= 14.0",
  "pyyaml >= 6.0",
  "requests >= 2.31",
  "matplotlib >= 3.8",
  "pydantic >= 2.0",
  "cutadapt >= 4.0",
  "dnaio >= 1.2",
]

[project.optional-dependencies]
ncbi = ["biopython >= 1.82", "pysradb >= 2.2"]
fast = ["pyfastx >= 2.0"]
# benchmark scaffolding. Snakemake is the only opt-in dep;
# Pearson/Spearman are computed via pandas (no SciPy).
#
# Pin rationale:
# - ``snakemake >= 7.0, < 8`` — floor keeps Python 3.10 compatible (the
#   project's minimum); ceiling prevents a future ``uv sync`` from
#   silently pulling Snakemake 8 (which requires Python 3.11+ and would
#   drop one CI-matrix Python version).
# - ``pulp < 2.8`` — Snakemake 7 calls ``pulp.list_solvers()`` at import
#   time; PuLP 2.8 removed the snake_case alias (only ``listSolvers``
#   remains) and Snakemake 7 hasn't been backported. Without this pin,
#   ``uv sync --extra bench`` on a fresh HPC venv resolves PuLP 3.x and
#   ``snakemake --version`` crashes with AttributeError. Surfaced during
#   the HPC audit attempt.
#
# HPC build gotcha (not a pin): Snakemake 7 pulls the C-extension ``datrie``,
# whose sdist needs Python dev headers (``Python.h``) to compile. On an HPC node
# without ``python3-dev`` a fresh ``uv sync --extra bench`` fails to build
# datrie. Workarounds: reuse an already-built venv (don't re-sync), or install
# snakemake via conda/bioconda (ships a prebuilt datrie), or provide the headers
# (``module load python``). Surfaced on the 2026-07 audit re-run.
bench = [
  "snakemake >= 7.0, < 8",
  "pulp < 2.8",
]
dev = [
  "pytest >= 7.0",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
  "build",
  "twine",
  "types-pyyaml",
  "types-requests",
  # Notebook re-execution check (not needed for the docs build or package runtime):
  #   uv run --extra dev jupyter nbconvert --to notebook --execute examples/*.ipynb
  "nbconvert",
  "ipykernel",
]
docs = ["mkdocs-material >= 9.5", "mkdocstrings[python] >= 0.25"]

[project.urls]
Homepage = "https://github.com/marcorotanegroni/selexprep"
Issues = "https://github.com/marcorotanegroni/selexprep/issues"
Documentation = "https://github.com/marcorotanegroni/selexprep#readme"
Changelog = "https://github.com/marcorotanegroni/selexprep/blob/main/CHANGELOG.md"

[project.scripts]
selexprep = "selexprep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/selexprep"]

# Ensure the bundled discovery catalog + curated metadata layer ship inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/selexprep/catalog/data/bioprojects.csv" = "selexprep/catalog/data/bioprojects.csv"
"src/selexprep/catalog/data/curated_metadata.json" = "selexprep/catalog/data/curated_metadata.json"
"src/selexprep/catalog/data/curated_metadata.csv" = "selexprep/catalog/data/curated_metadata.csv"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Typer's documented idiom calls typer.Option/typer.Argument as defaults;
# B008 is a false positive for Typer-style CLI definitions.
"src/selexprep/cli.py" = ["B008"]
"src/selexprep/catalog/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
# pydantic.mypy is required so strict-mypy resolves `BaseModel` field types in
# `selexprep.library.report` (without it, fields decay to `Any` under strict).
# Ships with pydantic >= 2; no separate install.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Permissive by default for v0.1 ports (focus is on functional correctness +
# tests, not strict typing). The centerpiece `library.report` is
# strict — that's where type-precision matters for the LibraryReport schema.
disable_error_code = [
  "type-arg",          # bare `dict`/`list` annotations are fine in v0.1 utility code
  "union-attr",        # .get() on parsed JSON returning dict|list — acceptable
  "no-any-return",     # `requests.json()` returns Any — acceptable
  "unused-ignore",     # cross-Python-version `# type: ignore` may be unused
  "no-untyped-call",   # ports from selex_corpus include untyped helpers
  "no-untyped-def",    # same
  "var-annotated",     # Counter()/dict() inits without explicit args — pragma
  "type-var",          # `max(c, key=c.get)` on Counter is a fine pattern
  "operator",          # arithmetic on values pulled from dict[str, Any]
  "arg-type",          # **kwargs unpacking + narrowed types are routine
  "assignment",        # int|None → int after a guard; acceptable in v0.1
  "attr-defined",      # downstream of the above; cascading
  "name-defined",      # `pq.lib.Table` works at runtime; pyarrow stubs lag
]

[[tool.mypy.overrides]]
module = "selexprep.library.report"
strict = true

[[tool.mypy.overrides]]
# equivalence rules are pure functions with a typed
# EquivalenceResult contract — type precision matters for the metric
# aggregator that consumes them, same rationale as library.report.
module = "selexprep.benchmark.equivalence"
strict = true

[[tool.mypy.overrides]]
# numpy 2.x ships PEP 695 `type` statements in its bundled stubs, which mypy
# rejects under `python_version = "3.10"` (kept for 3.10 compat) with a fatal
# "Type statement is only supported in Python 3.12+" parse error (seen on the
# 3.12 CI job, which resolves a newer numpy). Skip following numpy's stubs — the
# public API exposes pandas / JSON types, not numpy types.
# `follow_imports = "skip"` alone is NOT enough: mypy ignores it for stub
# (`.pyi`) files unless `follow_imports_for_stubs` is also set, and the offending
# `type` statement lives in numpy's bundled `__init__.pyi`.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "network: marks tests that require network access",
]
