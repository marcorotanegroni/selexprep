[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "selexprep"
version = "0.1.0"
description = "Accession-first preprocessing for public HT-SELEX with primer auto-inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{name = "Marco Rotanegroni", email = "marco.rotanegroni@studenti.unipd.it"}]
keywords = ["SELEX", "aptamer", "HT-SELEX", "bioinformatics", "primer", "FASTQ"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "typer >= 0.12",
  "pandas >= 2.0",
  "pyarrow >= 14.0",
  "pyyaml >= 6.0",
  "requests >= 2.31",
  "matplotlib >= 3.8",
  "pydantic >= 2.0",
  "cutadapt >= 4.0",
  "dnaio >= 1.2",
]

[project.optional-dependencies]
ncbi = ["biopython >= 1.82", "pysradb >= 2.2"]
fast = ["pyfastx >= 2.0"]
dev = [
  "pytest >= 7.0",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
  "build",
  "twine",
  "types-pyyaml",
  "types-requests",
]
docs = ["mkdocs-material >= 9.5", "mkdocstrings[python] >= 0.25"]

[project.urls]
Homepage = "https://github.com/marcorotanegroni/selexprep"
Issues = "https://github.com/marcorotanegroni/selexprep/issues"
Documentation = "https://github.com/marcorotanegroni/selexprep#readme"
Changelog = "https://github.com/marcorotanegroni/selexprep/blob/main/CHANGELOG.md"

[project.scripts]
selexprep = "selexprep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/selexprep"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Typer's documented idiom calls typer.Option/typer.Argument as defaults;
# B008 is a false positive for Typer-style CLI definitions.
"src/selexprep/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "selexprep.library.report"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "network: marks tests that require network access",
]
