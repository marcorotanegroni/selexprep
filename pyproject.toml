[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "selexprep"
version = "0.4.7"
description = "Accession-first preprocessing for public HT-SELEX with constant-region inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{name = "Marco Rotanegroni", email = "marco.rotanegroni@studenti.unipd.it"}]
keywords = ["SELEX", "aptamer", "HT-SELEX", "bioinformatics", "primer", "FASTQ"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "typer >= 0.12",
  "numpy >= 1.24",
  "pandas >= 2.0",
  "pyarrow >= 14.0",
  "pyyaml >= 6.0",
  "requests >= 2.31",
  "matplotlib >= 3.8",
  "pydantic >= 2.0",
  "cutadapt >= 4.0",
  "dnaio >= 1.2",
]

[project.optional-dependencies]
ncbi = ["biopython >= 1.82", "pysradb >= 2.2"]
fast = ["pyfastx >= 2.0"]
# Benchmarks only. snakemake < 8 keeps Python 3.10 support; pulp < 2.8 because
# Snakemake 7 calls pulp.list_solvers(), removed in PuLP 2.8. On nodes without
# Python headers, install snakemake from bioconda (datrie needs to compile).
bench = [
  "snakemake >= 7.0, < 8",
  "pulp < 2.8",
]
dev = [
  "pytest >= 7.0",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
  "build",
  "twine",
  "types-pyyaml",
  "types-requests",
  # re-run the example notebooks: jupyter nbconvert --to notebook --execute examples/*.ipynb
  "nbconvert",
  "ipykernel",
]
docs = ["mkdocs-material >= 9.5", "mkdocstrings[python] >= 0.25"]

[project.urls]
Homepage = "https://github.com/marcorotanegroni/selexprep"
Issues = "https://github.com/marcorotanegroni/selexprep/issues"
Documentation = "https://github.com/marcorotanegroni/selexprep#readme"
Changelog = "https://github.com/marcorotanegroni/selexprep/blob/main/CHANGELOG.md"

[project.scripts]
selexprep = "selexprep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/selexprep"]

# Ship the bundled catalogue inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/selexprep/catalog/data/bioprojects.csv" = "selexprep/catalog/data/bioprojects.csv"
"src/selexprep/catalog/data/curated_metadata.json" = "selexprep/catalog/data/curated_metadata.json"
"src/selexprep/catalog/data/curated_metadata.csv" = "selexprep/catalog/data/curated_metadata.csv"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Typer uses typer.Option/typer.Argument as defaults (B008 false positive).
"src/selexprep/cli.py" = ["B008"]
"src/selexprep/catalog/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Permissive by default; the LibraryReport schema and the benchmark equivalence
# rules are checked strictly (overrides below).
disable_error_code = [
  "type-arg",
  "union-attr",
  "no-any-return",
  "unused-ignore",
  "no-untyped-call",
  "no-untyped-def",
  "var-annotated",
  "type-var",
  "operator",
  "arg-type",
  "assignment",
  "attr-defined",
  "name-defined",
]

[[tool.mypy.overrides]]
module = "selexprep.library.report"
strict = true

[[tool.mypy.overrides]]
module = "selexprep.benchmark.equivalence"
strict = true

[[tool.mypy.overrides]]
# numpy 2 stubs use Python 3.12 `type` statements, which mypy rejects with
# python_version = "3.10"; skip them (stubs need follow_imports_for_stubs too).
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "network: marks tests that require network access",
]
